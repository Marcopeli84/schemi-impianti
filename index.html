<script>
'use strict';
/* ====================== lettore DXF (gira in un worker, a flusso) ====================== */
function workerMain(){
 function satDec(s){let o='',skip=false;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);if(skip){skip=false;continue;}
  if(c===0x20)o+=' ';else if(c===0x40)o+='_';else if(c===0x5F)o+='@';
  else if(c>=0x41&&c<0x5F){o+=String.fromCharCode(0x41+(0x5E-c));skip=(c===0x5E);}
  else o+=String.fromCharCode(c^0x5F);}return o;}
 function solidPts(lines){
  const recs=lines.map(satDec).join('').split('#');let pts=[],M=null;
  for(const r of recs){const p=r.split(/\s+/).filter(Boolean);if(!p.length)continue;
   if(p[0]==='transform'){const m=p.slice(3,16).map(Number);if(m.length===13&&m.every(isFinite))M=m;}
   else if(p[0]==='point'){const q=p.slice(4,7).map(Number);if(q.length===3&&q.every(isFinite))pts.push(q);}}
  if(!pts.length)return null;
  if(M){const t=M.slice(9,12),s=M[12];pts=pts.map(([x,y,z])=>[0,1,2].map(j=>(x*M[j]+y*M[3+j]+z*M[6+j])*s+t[j]));}
  return pts;}
 onmessage=async ev=>{
  const file=ev.data;
  try{
   const rd=file.stream().getReader(),dec=new TextDecoder('utf-8'),total=file.size||1;
   let got=0,carry='',have=false,code=0,lastPost=0,nlines=0;
   const out=[],skipped={},cnt={S:0,P:0};
   let inEnt=false,secWait=false,cur=null,sat=null,bb=null,poly=null,vx=0,vy=0,vz=0,vf=0;
   const xs=[0,0,0,0],ys=[0,0,0,0];
   const fresh=()=>[Infinity,Infinity,Infinity,-Infinity,-Infinity,-Infinity];
   const ext=(b,x,y,z)=>{if(x<b[0])b[0]=x;if(y<b[1])b[1]=y;if(z<b[2])b[2]=z;if(x>b[3])b[3]=x;if(y>b[4])b[4]=y;if(z>b[5])b[5]=z;};
   const push=(b,t)=>{if(b&&isFinite(b[0])&&isFinite(b[3])){out.push([Math.round(b[0]),Math.round(b[1]),Math.round(b[2]),Math.round(b[3]),Math.round(b[4]),Math.round(b[5]),t]);cnt[t]++;}};
   function endEnt(){
    if(cur==='3DSOLID'){const p=sat&&sat.length?solidPts(sat):null;if(p){const b=fresh();for(const q of p)ext(b,q[0],q[1],q[2]);push(b,'S');}sat=null;}
    else if(cur==='POLYLINE'){if(poly)poly.pf=(poly.flags&64)!==0;}
    else if(cur==='VERTEX'){if(poly&&(!poly.pf||(vf&64)))ext(poly.bb,vx,vy,vz);}
    else if(cur==='MESH'||cur==='3DFACE'){push(bb,'P');bb=null;}
    cur=null;}
   function endPoly(){if(poly){push(poly.bb,'P');poly=null;}}
   function start(t){
    if(t==='POLYLINE'){endPoly();poly={flags:0,pf:false,bb:fresh()};cur='POLYLINE';}
    else if(t==='VERTEX'){vx=vy=vz=0;vf=0;cur='VERTEX';}
    else if(t==='SEQEND'){endPoly();cur=null;}
    else if(t==='3DSOLID'){cur=t;sat=[];}
    else if(t==='MESH'||t==='3DFACE'){cur=t;bb=fresh();}
    else{cur=null;skipped[t]=(skipped[t]||0)+1;}}
   function handle(c,v){
    if(c===0){const t=v.trim();
     if(t==='SECTION'){endEnt();endPoly();inEnt=false;secWait=true;return;}
     if(t==='ENDSEC'){endEnt();endPoly();inEnt=false;return;}
     if(inEnt){endEnt();start(t);}return;}
    if(!inEnt){if(c===2&&secWait){secWait=false;inEnt=(v.trim()==='ENTITIES');}return;}
    if(cur==='3DSOLID'){if(c===1||c===3)sat.push(v);}
    else if(cur==='VERTEX'){if(c===10)vx=parseFloat(v);else if(c===20)vy=parseFloat(v);else if(c===30)vz=parseFloat(v);else if(c===70)vf=parseInt(v,10)||0;}
    else if(cur==='POLYLINE'){if(c===70&&poly)poly.flags=parseInt(v,10)||0;}
    else if(cur==='MESH'||cur==='3DFACE'){
     if(c>=10&&c<=13)xs[c-10]=parseFloat(v);else if(c>=20&&c<=23)ys[c-20]=parseFloat(v);
     else if(c>=30&&c<=33){const z=parseFloat(v),i=c-30;if(cur==='MESH'&&i!==0)return;ext(bb,xs[i],ys[i],z);}}}
   function run(lines){
    for(let i=0;i<lines.length;i++){let l=lines[i];
     if(l.charCodeAt(l.length-1)===13)l=l.slice(0,-1);
     if(!have){code=parseInt(l,10);have=true;}else{have=false;handle(code,l);}}
    nlines+=lines.length;}
   for(;;){const r=await rd.read();if(r.done)break;got+=r.value.length;
    const lines=(carry+dec.decode(r.value,{stream:true})).split('\n');carry=lines.pop();run(lines);
    const now=Date.now();if(now-lastPost>150){lastPost=now;postMessage({type:'p',pct:got/total,n:out.length});}}
   carry+=dec.decode();if(carry)run([carry]);endEnt();endPoly();
   postMessage({type:'done',pieces:out,skipped,cnt,lines:nlines});
  }catch(e){postMessage({type:'err',msg:String(e&&e.message||e)});}
 };
}

/* ====================== stato ====================== */
const BAND=800,MIN_PARETE=900,KEY='schemi-impianti-v2';
const NM={ymax:'Parete in alto',xmax:'Parete a destra',ymin:'Parete in basso',xmin:'Parete a sinistra'};
const WALLS=['ymax','xmax','ymin','xmin'];
const $=id=>document.getElementById(id),svg=$('svg');
function newState(){return {v:2,nome:'Nuovo progetto',room:{x0:0,y0:0,x1:4000,y1:3000,h:2700},show:{ymax:true,xmax:true,ymin:true,xmin:true},wr:{},pieces:[],
 ann:{ymax:[],xmax:[],ymin:[],xmin:[],C:[],D:[]},flip:false,ref:{h:'L',v:'p'},nid:1,pid:1};}
let S=newState(),ann=S.ann,VIEWS={},cur='D',tool='sel',sym='P',pre='B',snapOn=true,sel=null,selP=null,hist=[],vb={},dim=null,mouse=null,drag=null,OP=.7;
const SYM={
 P:['Presa','P','#c0392b','c',140,140],PD:['Presa doppia','PP','#c0392b','r',220,120],IN:['Interruttore','I','#7c3aed','r',100,100],LU:['Punto luce','L','#b8860b','c',140,140],
 AF:['Acqua fredda','AF','#1f6feb','c',140,140],AC:['Acqua calda','AC','#d62828','c',140,140],SC:['Scarico','S','#555555','c',140,140],GA:['Gas','G','#e67e22','c',140,140],
 CA:['Aspirazione cappa','CA','#2a9d8f','c',140,140],EL:['Allaccio elettrodomestico','E','#8e44ad','r',160,120],X:['Elemento libero','','#374151','r',200,200]};
const SHAPES={c:'Cerchio',r:'Rettangolo',t:'Triangolo'};
const PRE={B:{n:'Base',w:600,d:600,h:870,z:0},PE:{n:'Pensile',w:600,d:350,h:720,z:1400},CO:{n:'Colonna',w:600,d:600,h:2100,z:0},X:{n:'Mobile libero',w:600,d:600,h:600,z:0}};
const STYLE='<style>.ps{fill:rgba(60,95,160,.06);stroke:rgba(40,70,130,.35);stroke-width:.6;vector-effect:non-scaling-stroke}.pm{fill:rgba(200,120,40,.07);stroke:rgba(190,110,30,.4);stroke-width:.6;vector-effect:non-scaling-stroke}.pu{fill:rgba(40,150,90,.09);stroke:rgba(30,130,80,.55);stroke-width:.8;vector-effect:non-scaling-stroke}.sl{fill:rgba(31,111,235,.14)!important;stroke:#1f6feb!important;stroke-width:1.6!important}.fr{fill:none;stroke:#222;stroke-width:1.5;vector-effect:non-scaling-stroke}.fl{stroke:#222;stroke-width:2;vector-effect:non-scaling-stroke}text{font-family:system-ui,Segoe UI,sans-serif}</style>';

/* ====================== viste ====================== */
function buildViews(){
 const R=S.room,H=R.h,o={};
 const D={
  ymax:{d:[R.x0,R.x1],f:p=>p.y1>R.y1-BAND,r:p=>[p.x0,p.z0,p.x1,p.z1],mv:(p,a,b)=>{p.x0+=a;p.x1+=a;p.z0+=b;p.z1+=b;},mk:(u0,u1,z0,z1,d)=>({x0:u0,x1:u1,y0:R.y1-d,y1:R.y1,z0,z1})},
  xmax:{d:[-R.y1,-R.y0],f:p=>p.x1>R.x1-BAND,r:p=>[-p.y1,p.z0,-p.y0,p.z1],mv:(p,a,b)=>{p.y0-=a;p.y1-=a;p.z0+=b;p.z1+=b;},mk:(u0,u1,z0,z1,d)=>({y0:-u1,y1:-u0,x0:R.x1-d,x1:R.x1,z0,z1})},
  ymin:{d:[-R.x1,-R.x0],f:p=>p.y0<R.y0+BAND,r:p=>[-p.x1,p.z0,-p.x0,p.z1],mv:(p,a,b)=>{p.x0-=a;p.x1-=a;p.z0+=b;p.z1+=b;},mk:(u0,u1,z0,z1,d)=>({x0:-u1,x1:-u0,y0:R.y0,y1:R.y0+d,z0,z1})},
  xmin:{d:[R.y0,R.y1],f:p=>p.x0<R.x0+BAND,r:p=>[p.y0,p.z0,p.y1,p.z1],mv:(p,a,b)=>{p.y0+=a;p.y1+=a;p.z0+=b;p.z1+=b;},mk:(u0,u1,z0,z1,d)=>({y0:u0,y1:u1,x0:R.x0,x1:R.x0+d,z0,z1})}};
 for(const k of WALLS)if(S.show[k]){const d=S.wr[k]||D[k].d;
  o[k]={n:NM[k],s:'vista frontale della parete '+NM[k].replace('Parete ','')+' nella pianta',lab:'h',f:D[k].f,r:D[k].r,mv:D[k].mv,mk:D[k].mk,fr:[d[0],0,d[1],H]};}
 const plan={lab:'y',f:()=>true,r:p=>[p.x0,p.y0,p.x1,p.y1],mv:(p,a,b)=>{p.x0+=a;p.x1+=a;p.y0+=b;p.y1+=b;},fr:[R.x0,R.y0,R.x1,R.y1],
  mkp:(u,v,w,d,z0,h)=>({x0:u-w/2,x1:u+w/2,y0:v-d/2,y1:v+d/2,z0,z1:z0+h})};
 o.C={n:'Soffitto',s:'vista dal basso (planimetria soffitto)',...plan};
 o.D={n:'Pavimento',s:"vista dall'alto",...plan};
 return o;}
let cache={},ec={};
function inval(){cache={};ec={};}
const U=(v,u)=>(v==='C'&&S.flip)?-u:u;
function rects(v){if(cache[v])return cache[v];const V=VIEWS[v];return cache[v]=S.pieces.filter(V.f).map(p=>V.r(p).concat([p]));}
function edgesOf(v,ex){const s=new Set(),t=new Set(),V=VIEWS[v];
 for(const p of S.pieces){if(p.id===ex||!V.f(p))continue;const r=V.r(p);s.add(Math.round(r[0]));s.add(Math.round(r[2]));t.add(Math.round(r[1]));t.add(Math.round(r[3]));}
 const f=V.fr;[f[0],f[2]].forEach(x=>s.add(x));[f[1],f[3]].forEach(x=>t.add(x));return [[...s],[...t]];}
function E(v){return ec[v]||(ec[v]=edgesOf(v,null));}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function piecesSVG(v,live){
 const V=VIEWS[v],f=V.fr;let s='';
 const fx0=Math.min(U(v,f[0]),U(v,f[2])),fw=Math.abs(f[2]-f[0]);
 s+=`<rect class="fr" x="${fx0}" y="${-f[3]}" width="${fw}" height="${f[3]-f[1]}"/><g opacity="${OP}">`;
 for(const q of rects(v)){const p=q[4],a=U(v,q[0]),b=U(v,q[2]),x=Math.min(a,b),w=Math.max(Math.abs(b-a),.4),h=Math.max(q[3]-q[1],.4);
  const cl=(live&&selP===p.id)?'sl':(p.t==='P'?'pm':p.t==='M'?'pu':'ps');
  s+=`<rect class="${cl}" ${live?`data-pid="${p.id}" `:''}x="${x.toFixed(1)}" y="${(-q[3]).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"/>`;}
 s+='</g>';
 if(V.lab==='h')s+=`<line class="fl" x1="${fx0}" x2="${fx0+fw}" y1="0" y2="0"/>`;
 return s;}
function symSVG(a,v,hl){const x=U(v,a.u),y=-a.v,c=a.color||SYM[a.k][2],w=a.w,h=a.h,code=a.code||'';
 let sh;if(a.shape==='c')sh=`<ellipse rx="${w/2}" ry="${h/2}" fill="#fff" stroke="${c}" stroke-width="7"/>`;
 else if(a.shape==='t')sh=`<polygon points="0,${-h/2} ${w/2},${h/2} ${-w/2},${h/2}" fill="#fff" stroke="${c}" stroke-width="7" stroke-linejoin="round"/>`;
 else sh=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="8" fill="#fff" stroke="${c}" stroke-width="7"/>`;
 const fs=Math.max(24,Math.min(h*.5,(w*.8)/Math.max(1,code.length*.62),70)),ty=a.shape==='t'?h/6:0;
 return `<g data-id="${a.id}" transform="translate(${x},${y})"><rect x="${-w/2-25}" y="${-h/2-25}" width="${w+50}" height="${h+50}" fill="transparent"/>${hl?`<rect x="${-w/2-18}" y="${-h/2-18}" width="${w+36}" height="${h+36}" fill="none" stroke="#1f6feb" stroke-width="6" stroke-dasharray="14 10"/>`:''}${sh}<text y="${ty+2}" text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-weight="700" fill="${c}">${esc(code)}</text>${a.label?`<text y="${h/2+52}" text-anchor="middle" font-size="56" fill="#222" stroke="#fff" stroke-width="12" paint-order="stroke">${esc(a.label)}</text>`:''}</g>`;}
function anchor(v,s,k,ax){const dr=(v==='C'&&S.flip)?-1:1;
 if(ax==='h')return s.u+(k==='r'?1:k==='l'?-1:0)*dr*s.w/2;
 return s.v+(k==='t'?1:k==='b'?-1:0)*s.h/2;}
function resolve(v,d){for(const k of ['r1','r2']){const r=d[k];if(!r)continue;const s=ann[v].find(a=>a.id===r.id&&a.t==='s');if(!s){d[k]=null;continue;}const i=k==='r1';
  if(d.ax==='h'){const p=anchor(v,s,r.k,'h');if(i){d.a=p;d.p1=s.v;}else{d.b=p;d.p2=s.v;}}else{const p=anchor(v,s,r.k,'v');if(i){d.a=p;d.p1=s.u;}else{d.b=p;d.p2=s.u;}}}}
function dimSVG(d,v,hl,pv){
 const len=Math.round(Math.abs(d.b-d.a)),t=d.txt||len,col=hl?'#1f6feb':'#111';let s='';

  if(isS){h+=`<small>Sigla scritta nel simbolo</small><input type="text" id="pc" maxlength="6" value="${esc(a.code||'')}"><small>Forma</small><select id="psh">${Object.entries(SHAPES).map(([k,n])=>`<option value="${k}"${a.shape===k?' selected':''}>${n}</option>`).join('')}</select>`;
   h+=a.shape==='c'?`<small>Diametro (mm)</small><input type="number" id="pw" min="20" step="10" value="${Math.round(a.w)}">`:`<div class="row"><div><small>Larghezza (mm)</small><input type="number" id="pw" min="20" step="10" value="${Math.round(a.w)}"></div><div><small>Altezza (mm)</small><input type="number" id="ph2" min="20" step="10" value="${Math.round(a.h)}"></div></div>`;
   h+=`<small>Colore</small><input type="color" id="pcol" value="${a.color||SYM[a.k][2]}" style="width:60px;height:30px;padding:0;margin:3px 0 8px"><small>Testo sotto il simbolo</small><input type="text" id="pv" value="${esc(a.label||'')}">`;}
  else h+=`<textarea id="pv" rows="3">${esc(a.txt)}</textarea>`;
  h+=`<hr style="border:0;border-top:1px solid #e5e7eb"><small>Posizione misurata dal centro, partendo da…</small><div class="row"><select id="rh"><option value="L"${S.ref.h==='L'?' selected':''}>Sinistra</option><option value="R"${S.ref.h==='R'?' selected':''}>Destra</option></select><select id="rv"><option value="p"${S.ref.v==='p'?' selected':''}>${pp.vopt[0]}</option><option value="q"${S.ref.v==='q'?' selected':''}>${pp.vopt[1]}</option></select></div>`+
  `<small>Orizzontale (mm)</small><input type="number" id="ph" step="10" value="${pp.h(a)}"><small>Verticale (mm)</small><input type="number" id="pvv" step="10" value="${pp.v(a)}"><div class="row"><button id="pdup">Duplica</button></div>${del_}`;
  el.innerHTML=h;
  $('pv').onfocus=push;$('pv').oninput=ev=>{if(isS){a.label=ev.target.value;a.auto=false;}else a.txt=ev.target.value;drawAnn();autosave();};
  if(isS){
   $('pc').onfocus=push;$('pc').oninput=ev=>{a.code=ev.target.value;drawAnn();autosave();};
   $('psh').onchange=ev=>{push();a.shape=ev.target.value;if(a.shape==='c')a.h=a.w;drawAnn();props();autosave();};
   $('pw').onfocus=push;$('pw').oninput=ev=>{const x=Math.max(20,+ev.target.value||20);a.w=x;if(a.shape==='c')a.h=x;drawAnn();autosave();};
   if($('ph2')){$('ph2').onfocus=push;$('ph2').oninput=ev=>{a.h=Math.max(20,+ev.target.value||20);drawAnn();autosave();};}
   $('pcol').onfocus=push;$('pcol').oninput=ev=>{a.color=ev.target.value;drawAnn();autosave();};}
  $('rh').onchange=ev=>{S.ref.h=ev.target.value;props();autosave();};$('rv').onchange=ev=>{S.ref.v=ev.target.value;props();autosave();};
  $('ph').onfocus=$('pvv').onfocus=push;
  $('ph').onchange=$('pvv').onchange=()=>{autosave();};
  $('ph').oninput=$('pvv').oninput=ev=>{if(ev.target.value==='')return;(ev.target.id==='ph'?pp.sh:pp.sv)(a,+ev.target.value);syncLabel(a);drawAnn();const l=$('pv');if(l&&isS)l.value=a.label||'';};
  $('pdup').onclick=()=>{push();const c=JSON.parse(JSON.stringify(a));c.id=S.nid++;c.u+=150;syncLabel(c);ann[cur].push(c);sel=c.id;drawAnn();props();autosave();};}
 else{resolve(cur,a);const len=Math.round(Math.abs(a.b-a.a)),both=a.r1&&a.r2,lk=a.r1||a.r2,fx=a.fix||'a';
  const opts=a.ax==='h'?[['c','Centro'],['l','Lato sinistro'],['r','Lato destro']]:[['c','Centro'],['t','Lato superiore'],['b','Lato inferiore']];
  const sel_=(id,r)=>`<small>Quota misurata da (${esc(symName(r))})</small><select id="${id}">${opts.map(o=>`<option value="${o[0]}"${r.k===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`;
  let h=`<b>Quota</b><br>`;
  if(lk)h+=`<small>Valore (mm): scrivilo e l'elemento quotato si sposta</small><input type="number" id="dv" step="10" value="${len}">`;
  else h+=`<small>Valore: ${len} mm. Nessun simbolo collegato: per poter cambiare il valore rifai la quota cliccando sul centro di un simbolo.</small><br>`;
  if(both)h+=`<small>Cosa resta fermo (riferimento)</small><label class="ck"><input type="radio" name="fx" value="a"${fx==='a'?' checked':''}> ${esc(symName(a.r1))}</label><label class="ck"><input type="radio" name="fx" value="b"${fx==='b'?' checked':''}> ${esc(symName(a.r2))}</label><br>`;
  else if(lk)h+=`<small>Resta fermo l'altro punto (bordo o punto fisso). Si muove: ${esc(symName(a.r1||a.r2))}.</small><br>`;
  if(a.r1)h+=sel_('ek1',a.r1);if(a.r2)h+=sel_('ek2',a.r2);
  h+=`<small>Testo diverso dal valore (vuoto = valore reale)</small><input type="text" id="pv" value="${esc(a.txt||'')}"><small>Trascina la linea per spostarla.</small><br>${del_}`;
  el.innerHTML=h;
  $('pv').onfocus=push;$('pv').oninput=ev=>{a.txt=ev.target.value;drawAnn();autosave();};
  if($('dv')){$('dv').onfocus=push;$('dv').oninput=ev=>{if(ev.target.value==='')return;a.txt='';applyDim(a,Math.abs(+ev.target.value));drawAnn();autosave();};}
  el.querySelectorAll('input[name=fx]').forEach(r=>r.onchange=()=>{push();a.fix=r.value;autosave();});
  if($('ek1'))$('ek1').onchange=ev=>{push();a.r1.k=ev.target.value;drawAnn();props();autosave();};
  if($('ek2'))$('ek2').onchange=ev=>{push();a.r2.k=ev.target.value;drawAnn();props();autosave();};}
 $('pd').onclick=del;}
function tb(){document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t===tool&&(tool==='sel'||tool==='mob'||tool==='dim'||tool==='txt'||(tool==='sym'&&b.dataset.k===sym)||(tool==='pc'&&b.dataset.k===pre))));}
function buildTools(){let h='<h3>Strumenti</h3><button data-t="sel">☝ Simboli: seleziona / sposta</button><button data-t="mob">▭ Modifica mobili</button><button data-t="dim">↔ Quota</button><button data-t="txt">T Testo</button><h3>Mobili (clic o trascina)</h3>';
 for(const k in PRE)h+=`<button data-t="pc" data-k="${k}" draggable="true" title="${PRE[k].w}×${PRE[k].d}×${PRE[k].h}"><span class="bx"></span>${PRE[k].n}</button>`;
 h+='<h3>Simboli (clic o trascina)</h3>';
 for(const k in SYM){const d=SYM[k];h+=`<button data-t="sym" data-k="${k}" draggable="true"><span class="dot" style="border-color:${d[2]};color:${d[2]}">${d[1]||'+'}</span>${d[0]}</button>`;}
 h+='<label class="ck"><input type="checkbox" id="snap" checked> Aggancia ai bordi</label>';
 $('tools').innerHTML=h;
 $('tools').onclick=e=>{const b=e.target.closest('button');if(!b)return;tool=b.dataset.t;if(tool==='sym')sym=b.dataset.k;if(tool==='pc')pre=b.dataset.k;dim=null;if(tool!=='mob')selP=null;if(tool==='mob')sel=null;tb();hint();drawAll();props();};
 $('tools').ondragstart=e=>{const b=e.target.closest('button[data-k]');if(b)e.dataTransfer.setData('text/plain',b.dataset.t==='pc'?'pc:'+b.dataset.k:b.dataset.k);};
 $('snap').onchange=e=>{snapOn=e.target.checked;};tb();}
function buildTabs(){$('tabs').innerHTML=Object.keys(VIEWS).map(k=>`<button data-v="${k}" class="${k===cur?'on':''}" title="${VIEWS[k].s}">${VIEWS[k].n}</button>`).join('');
 $('flipbox').style.display=cur==='C'?'flex':'none';}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;go(b.dataset.v);};
function go(v){cur=v;sel=null;selP=null;dim=null;tool=(tool==='sym'||tool==='pc')?'sel':tool;if(!vb[v])vb[v]=fitVB(v);buildTabs();tb();hint();setVB();drawAll();props();}
function rebuild(){VIEWS=buildViews();inval();vb={};if(!VIEWS[cur])cur='D';go(cur);}
$('flip').onchange=e=>{S.flip=e.target.checked;vb.C=fitVB('C');drawAll();setVB();autosave();};
$('op').oninput=e=>{OP=e.target.value/100;drawAll();};
$('undo').onclick=undo;$('fit').onclick=()=>{vb[cur]=fitVB(cur);setVB();};
$('clr').onclick=()=>{if(!ann[cur].length||!confirm('Cancellare tutti i simboli e le quote di questa vista?'))return;push();ann[cur]=[];sel=null;drawAnn();props();autosave();};
$('pn').oninput=e=>{S.nome=e.target.value;autosave();};
function fullSVG(v,w){const b=fitVB(v);return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b.join(' ')}"${w?` width="${w}"`:''}>${STYLE}<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" fill="#fff"/>${piecesSVG(v,false)}${annSVG(v,false)}</svg>`;}
$('svgb').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([fullSVG(cur)],{type:'image/svg+xml'}));a.download=S.nome+' - '+VIEWS[cur].n+'.svg';a.click();};
$('prt').onclick=()=>{let h='';for(const v in VIEWS){h+=`<div class="page"><h2>${esc(S.nome)} — ${VIEWS[v].n} (${VIEWS[v].s})</h2>${fullSVG(v)}</div>`;}$('print').innerHTML=h;setTimeout(()=>print(),50);};
$('save').onclick=async()=>{const txt=stateText(),name=S.nome+' - impianti.json';
 try{if(window.showSaveFilePicker){const h=await showSaveFilePicker({suggestedName:name,types:[{description:'Lavoro impianti',accept:{'application/json':['.json']}}]});const w=await h.createWritable();await w.write(txt);await w.close();return;}}catch(e){if(e&&e.name==='AbortError')return;}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click();};
$('open').onclick=async()=>{try{if(window.showOpenFilePicker){const [h]=await showOpenFilePicker({types:[{description:'Lavoro impianti',accept:{'application/json':['.json']}}]});const f=await h.getFile();openText(await f.text());return;}}catch(e){if(e&&e.name==='AbortError')return;}$('file').click();};
function openText(t){push();try{loadState(JSON.parse(t));}catch(x){hist.pop();alert('Questo file non è un lavoro salvato da questa applicazione.');return;}rebuild();autosave();}
$('file').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(openText);e.target.value='';};

/* ====================== finestre ====================== */
function modal(html){$('box').innerHTML=html;$('ovl').style.display='flex';}
function closeModal(){$('ovl').style.display='none';$('box').innerHTML='';}
$('bnew').onclick=()=>{
 if((S.pieces.length||Object.values(ann).some(a=>a.length))&&!confirm('Iniziare un nuovo progetto con stanza vuota? Quello attuale si può recuperare con Annulla (Ctrl+Z) finché non chiudi la pagina; se non l\'hai salvato, salvalo prima.'))return;
 push();const n=newState();n.nid=S.nid;n.pid=S.pid;S=n;ann=S.ann;$('pn').value=S.nome;$('flip').checked=false;sel=selP=null;rebuild();autosave();roomDlg();};
function roomDlg(){const R=S.room;
 modal(`<h2>Stanza</h2><div class="f"><div><small>Larghezza (mm, parete in alto)</small><input type="number" id="rw" step="10" value="${R.x1-R.x0}"></div><div><small>Profondità (mm)</small><input type="number" id="rd" step="10" value="${R.y1-R.y0}"></div><div><small>Altezza (mm)</small><input type="number" id="rhh" step="10" value="${R.h}"></div></div>
 <p><small>Pareti da mostrare</small>${WALLS.map(k=>`<label class="ck"><input type="checkbox" data-w="${k}"${S.show[k]?' checked':''}> ${NM[k]}</label>`).join('')}</p>
 <p><small>Il soffitto (visto dal basso) e il pavimento (visto dall'alto) ci sono sempre. «Parete in alto» è quella in alto nella pianta vista dall'alto.</small></p>
 <div class="acts"><button id="rc">Annulla</button><button id="rok" class="pri">Applica</button></div>`);
 $('rc').onclick=closeModal;
 $('rok').onclick=()=>{const w=Math.max(500,+$('rw').value||0),d=Math.max(500,+$('rd').value||0),h=Math.max(1000,+$('rhh').value||0);
  push();const ch=(w!==R.x1-R.x0)||(d!==R.y1-R.y0);
  S.room={x0:R.x0,y0:R.y0,x1:R.x0+w,y1:R.y0+d,h};if(ch)S.wr={};
  document.querySelectorAll('[data-w]').forEach(c=>{S.show[c.dataset.w]=c.checked;});
  closeModal();rebuild();autosave();};}
$('broom').onclick=roomDlg;

/* ====================== importazione DXF ====================== */
let worker=null;
$('bdxf').onclick=()=>$('fdxf').click();
$('fdxf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importDxf(f);};
function importDxf(f){
 if(!/\.dxf$/i.test(f.name)){alert(/\.dwg$/i.test(f.name)?'Questo è un DWG. In Metron salva o esporta lo stesso progetto in formato DXF e scegli quello.':'Il file non è un DXF.');return;}
 const mb=Math.round(f.size/1048576);
 modal(`<h2>Lettura del DXF</h2><p>${esc(f.name)} (${mb} MB). Con i file grandi può servire un minuto: la pagina resta utilizzabile.</p><div class="bar"><i id="bi"></i></div><p id="bt">Avvio…</p><div class="acts"><button id="bx">Annulla</button></div>`);
 try{const url=URL.createObjectURL(new Blob(['('+workerMain.toString()+')()'],{type:'text/javascript'}));worker=new Worker(url);}catch(x){closeModal();alert('Il browser non permette la lettura del DXF in questa modalità. Prova con Chrome o Edge.');return;}
 const w=worker;$('bx').onclick=()=>{w.terminate();worker=null;closeModal();};
 w.onmessage=ev=>{const m=ev.data;
  if(m.type==='p'){const b=$('bi'),t=$('bt');if(b){b.style.width=Math.round(m.pct*100)+'%';t.textContent=Math.round(m.pct*100)+'% — '+m.n+' elementi trovati';}}
  else if(m.type==='err'){w.terminate();worker=null;closeModal();alert('Errore nella lettura del DXF: '+m.msg);}
  else if(m.type==='done'){w.terminate();worker=null;importDone(f,m);}};
 w.onerror=ev=>{w.terminate();worker=null;closeModal();alert('Errore nella lettura del DXF.');};
 w.postMessage(f);}
function fascia(pcs,lato,ext){let sel,uv;
 if(lato==='ymax'){sel=pcs.filter(p=>p[4]>ext.ymax-BAND);uv=p=>[p[0],p[3]];}
 else if(lato==='ymin'){sel=pcs.filter(p=>p[1]<ext.ymin+BAND);uv=p=>[-p[3],-p[0]];}
 else if(lato==='xmax'){sel=pcs.filter(p=>p[3]>ext.xmax-BAND);uv=p=>[-p[4],-p[1]];}
 else{sel=pcs.filter(p=>p[0]<ext.xmin+BAND);uv=p=>[p[1],p[4]];}
 const iv=sel.map(uv).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);let cop=0,fine=null,umin=null,umax=null;
 for(const [a,b] of iv){umin=umin===null?a:Math.min(umin,a);umax=umax===null?b:Math.max(umax,b);
  if(fine===null||a>fine){cop+=b-a;fine=b;}else if(b>fine){cop+=b-fine;fine=b;}}
 return {cop,umin,umax};}
function importDone(f,m){
 const pcs=m.pieces;
 if(!pcs.length){modal(`<h2>Nessun elemento trovato</h2><p>Nel DXF non ci sono solidi o mesh leggibili. Controlla che sia l'esportazione 3D del progetto Metron.</p><div class="acts"><button id="ok" class="pri">Chiudi</button></div>`);$('ok').onclick=closeModal;return;}
 const ext={xmin:Math.min(...pcs.map(p=>p[0])),xmax:Math.max(...pcs.map(p=>p[3])),ymin:Math.min(...pcs.map(p=>p[1])),ymax:Math.max(...pcs.map(p=>p[4]))};
 const zmax=pcs.reduce((a,p)=>Math.max(a,p[5]),0),H=Math.max(2700,Math.ceil(zmax/100)*100);
 const cand=WALLS.map(k=>({k,...fascia(pcs,k,ext)})).filter(c=>c.cop>0).sort((a,b)=>b.cop-a.cop);
 let prop=cand.filter(c=>c.cop>=MIN_PARETE);if(!prop.length)prop=cand.slice(0,1);
 const have=Object.values(ann).some(a=>a.length)||S.pieces.length;
 const sk=Object.entries(m.skipped).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>k+' ('+v+')').join(', ');
 modal(`<h2>DXF letto</h2><p><b>${pcs.length}</b> elementi (${m.cnt.S} solidi, ${m.cnt.P} mesh). Ingombro <b>${ext.xmax-ext.xmin} × ${ext.ymax-ext.ymin} mm</b>, altezza massima ${Math.round(zmax)} mm.${sk?`<br><small>Tipi ignorati: ${esc(sk)}</small>`:''}</p>
 <p><small>Pareti con mobili (proposte già spuntate)</small>${cand.map(c=>`<label class="ck"><input type="checkbox" data-w="${c.k}"${prop.includes(c)?' checked':''}> ${NM[c.k]} — mobili per ${Math.round(c.cop)} mm</label>`).join('')}</p>
 ${have?`<label class="ck"><input type="checkbox" id="keep"> Tieni i simboli e le quote già disegnati</label><p><small>Sostituisco stanza e mobili con quelli del DXF. Se non spunti, anche simboli e quote ripartono da zero. Con Annulla torni al progetto di prima.</small></p>`:''}
 <div class="acts"><button id="ic">Annulla</button><button id="iok" class="pri">Importa</button></div>`);
 $('ic').onclick=closeModal;
 $('iok').onclick=()=>{const chosen=[...document.querySelectorAll('[data-w]')].filter(c=>c.checked).map(c=>c.dataset.w),keep=$('keep')&&$('keep').checked;
  push();const old=S.ann,n=newState();
  n.nome=f.name.replace(/\.dxf$/i,'');n.room={x0:ext.xmin,y0:ext.ymin,x1:ext.xmax,y1:ext.ymax,h:H};
  n.show={ymax:false,xmax:false,ymin:false,xmin:false};for(const k of chosen)n.show[k]=true;
  for(const c of cand)if(n.show[c.k])n.wr[c.k]=[Math.floor(c.umin),Math.ceil(c.umax)];
  n.pid=1;n.pieces=pcs.map(p=>({id:n.pid++,x0:p[0],y0:p[1],z0:p[2],x1:p[3],y1:p[4],z1:p[5],t:p[6]}));
  n.nid=S.nid;if(keep){for(const k in old)n.ann[k]=old[k];}
  S=n;ann=S.ann;$('pn').value=S.nome;$('flip').checked=false;sel=selP=null;tool='sel';closeModal();cur='D';rebuild();autosave();};}
addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))$('dz').style.display='flex';});
addEventListener('dragleave',e=>{if(!e.relatedTarget)$('dz').style.display='none';});
addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault();});
addEventListener('drop',e=>{$('dz').style.display='none';const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;e.preventDefault();
 if(/\.dxf$/i.test(f.name)||/\.dwg$/i.test(f.name))importDxf(f);else if(/\.json$/i.test(f.name))f.text().then(openText);});

/* ====================== avvio ====================== */
{try{const s=localStorage.getItem(KEY);if(s)loadState(JSON.parse(s));}catch(e){S=newState();ann=S.ann;}
 $('pn').value=S.nome;$('flip').checked=S.flip;}
buildTools();VIEWS=buildViews();cur=VIEWS.D?'D':Object.keys(VIEWS)[0];cur=VIEWS.ymax?'ymax':cur;go(cur);
window.__t={get S(){return S;},get cur(){return cur;},get ann(){return ann;},importDxf,workerMain};
