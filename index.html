<script>
'use strict';
/* ====================== lettore DXF (gira in un worker, a flusso) ====================== */
function workerMain(){
 function satDec(s){let o='',skip=false;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);if(skip){skip=false;continue;}
  if(c===0x20)o+=' ';else if(c===0x40)o+='_';else if(c===0x5F)o+='@';
  else if(c>=0x41&&c<0x5F){o+=String.fromCharCode(0x41+(0x5E-c));skip=(c===0x5E);}
  else o+=String.fromCharCode(c^0x5F);}return o;}
 function solidPts(lines){
  const recs=lines.map(satDec).join('').split('#');let pts=[],M=null;
  for(const r of recs){const p=r.split(/\s+/).filter(Boolean);if(!p.length)continue;
   if(p[0]==='transform'){const m=p.slice(3,16).map(Number);if(m.length===13&&m.every(isFinite))M=m;}
   else if(p[0]==='point'){const q=p.slice(4,7).map(Number);if(q.length===3&&q.every(isFinite))pts.push(q);}}
  if(!pts.length)return null;
  if(M){const t=M.slice(9,12),s=M[12];pts=pts.map(([x,y,z])=>[0,1,2].map(j=>(x*M[j]+y*M[3+j]+z*M[6+j])*s+t[j]));}
  return pts;}
 function obb(pts){
  const P=pts.map(q=>[q[0],q[1]]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[];for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  const up=[];for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  up.pop();lo.pop();const H=lo.concat(up);if(H.length<3)return null;
  let best=null;
  for(let i=0;i<H.length;i++){const a=H[i],b=H[(i+1)%H.length],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);if(L<1e-6)continue;
   const ux=dx/L,uy=dy/L;let u0=1e300,u1=-1e300,v0=1e300,v1=-1e300;
   for(const p of H){const u=(p[0]-a[0])*ux+(p[1]-a[1])*uy,v=-(p[0]-a[0])*uy+(p[1]-a[1])*ux;if(u<u0)u0=u;if(u>u1)u1=u;if(v<v0)v0=v;if(v>v1)v1=v;}
   const ar=(u1-u0)*(v1-v0);if(!best||ar<best.ar)best={ar,a,ux,uy,u0,u1,v0,v1};}
  return best;}
 /* se l'elemento è ruotato in pianta restituisce i 4 angoli del rettangolo orientato (antiorario), altrimenti 0 */
 function obbQuad(pts,b){
  if(!pts||pts.length<3)return 0;const r=obb(pts);if(!r)return 0;
  const aa=(b[3]-b[0])*(b[4]-b[1]);if(!(aa>0)||r.ar>=aa*0.985)return 0;
  const q=[];for(const [u,v] of [[r.u0,r.v0],[r.u1,r.v0],[r.u1,r.v1],[r.u0,r.v1]])q.push(Math.round((r.a[0]+u*r.ux-v*r.uy)*10)/10,Math.round((r.a[1]+u*r.uy+v*r.ux)*10)/10);
  return q;}
 onmessage=async ev=>{
  const file=ev.data;
  try{
   const rd=file.stream().getReader(),dec=new TextDecoder('utf-8'),total=file.size||1;
   let got=0,carry='',have=false,code=0,lastPost=0,nlines=0;
   const out=[],skipped={},cnt={S:0,P:0};
   let inEnt=false,secWait=false,cur=null,sat=null,bb=null,bp=null,poly=null,vx=0,vy=0,vz=0,vf=0;
   const xs=[0,0,0,0],ys=[0,0,0,0];
   const fresh=()=>[Infinity,Infinity,Infinity,-Infinity,-Infinity,-Infinity];
   const ext=(b,x,y,z)=>{if(x<b[0])b[0]=x;if(y<b[1])b[1]=y;if(z<b[2])b[2]=z;if(x>b[3])b[3]=x;if(y>b[4])b[4]=y;if(z>b[5])b[5]=z;};
   const push=(b,t,q)=>{if(b&&isFinite(b[0])&&isFinite(b[3])){out.push([Math.round(b[0]),Math.round(b[1]),Math.round(b[2]),Math.round(b[3]),Math.round(b[4]),Math.round(b[5]),t,q||0]);cnt[t]++;}};
   function endEnt(){
    if(cur==='3DSOLID'){const p=sat&&sat.length?solidPts(sat):null;if(p){const b=fresh();for(const q of p)ext(b,q[0],q[1],q[2]);push(b,'S',obbQuad(p,b));}sat=null;}
    else if(cur==='POLYLINE'){if(poly)poly.pf=(poly.flags&64)!==0;}
    else if(cur==='VERTEX'){if(poly&&(!poly.pf||(vf&64))){ext(poly.bb,vx,vy,vz);poly.pts.push([vx,vy]);}}
    else if(cur==='MESH'||cur==='3DFACE'){push(bb,'P',obbQuad(bp,bb));bb=null;bp=null;}
    cur=null;}
   function endPoly(){if(poly){push(poly.bb,'P',obbQuad(poly.pts,poly.bb));poly=null;}}
   function start(t){
    if(t==='POLYLINE'){endPoly();poly={flags:0,pf:false,bb:fresh(),pts:[]};cur='POLYLINE';}
    else if(t==='VERTEX'){vx=vy=vz=0;vf=0;cur='VERTEX';}
    else if(t==='SEQEND'){endPoly();cur=null;}
    else if(t==='3DSOLID'){cur=t;sat=[];}
    else if(t==='MESH'||t==='3DFACE'){cur=t;bb=fresh();bp=[];}
    else{cur=null;skipped[t]=(skipped[t]||0)+1;}}
   function handle(c,v){
    if(c===0){const t=v.trim();
     if(t==='SECTION'){endEnt();endPoly();inEnt=false;secWait=true;return;}
     if(t==='ENDSEC'){endEnt();endPoly();inEnt=false;return;}
     if(inEnt){endEnt();start(t);}return;}
    if(!inEnt){if(c===2&&secWait){secWait=false;inEnt=(v.trim()==='ENTITIES');}return;}
    if(cur==='3DSOLID'){if(c===1||c===3)sat.push(v);}
    else if(cur==='VERTEX'){if(c===10)vx=parseFloat(v);else if(c===20)vy=parseFloat(v);else if(c===30)vz=parseFloat(v);else if(c===70)vf=parseInt(v,10)||0;}
    else if(cur==='POLYLINE'){if(c===70&&poly)poly.flags=parseInt(v,10)||0;}
    else if(cur==='MESH'||cur==='3DFACE'){
     if(c>=10&&c<=13)xs[c-10]=parseFloat(v);else if(c>=20&&c<=23)ys[c-20]=parseFloat(v);
     else if(c>=30&&c<=33){const z=parseFloat(v),i=c-30;if(cur==='MESH'&&i!==0)return;ext(bb,xs[i],ys[i],z);bp.push([xs[i],ys[i]]);}}}
   function run(lines){
    for(let i=0;i<lines.length;i++){let l=lines[i];
     if(l.charCodeAt(l.length-1)===13)l=l.slice(0,-1);
     if(!have){code=parseInt(l,10);have=true;}else{have=false;handle(code,l);}}
    nlines+=lines.length;}
   for(;;){const r=await rd.read();if(r.done)break;got+=r.value.length;
    const lines=(carry+dec.decode(r.value,{stream:true})).split('\n');carry=lines.pop();run(lines);
    const now=Date.now();if(now-lastPost>150){lastPost=now;postMessage({type:'p',pct:got/total,n:out.length});}}
   carry+=dec.decode();if(carry)run([carry]);endEnt();endPoly();
   postMessage({type:'done',pieces:out,skipped,cnt,lines:nlines});
  }catch(e){postMessage({type:'err',msg:String(e&&e.message||e)});}
 };
}

/* ====================== stato ====================== */
const BAND=800,MIN_PARETE=900,TOLW=150,CLUS=100,MAXCAND=20,KEY='schemi-impianti-v2';
/* Le pareti sono una lista senza limite di numero e a qualsiasi angolo. Ogni parete è un segmento p1→p2 nella pianta,
   scritto da sinistra a destra guardandolo da dentro la stanza. Le 4 pareti della stanza rettangolare iniziale
   sono "auto" (side): seguono le misure della stanza. */
const SIDES=['ymax','xmax','ymin','xmin'];
const SIDEN={ymax:'lato alto della pianta',xmax:'lato destro della pianta',ymin:'lato basso della pianta',xmin:'lato sinistro della pianta'};
const DEFN={ymax:'Parete 1',xmax:'Parete 2',ymin:'Parete 3',xmin:'Parete 4'};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const EPS=1e-6;
function defWalls(){return SIDES.map(s=>({k:s,n:DEFN[s],side:s,auto:true,show:true}));}
function wallGeom(w,R){R=R||S.room;
 if(w.auto){const s=w.side;
  return s==='ymax'?{p1:[R.x0,R.y1],p2:[R.x1,R.y1]}:s==='xmax'?{p1:[R.x1,R.y1],p2:[R.x1,R.y0]}:s==='ymin'?{p1:[R.x1,R.y0],p2:[R.x0,R.y0]}:{p1:[R.x0,R.y0],p2:[R.x0,R.y1]};}
 return {p1:w.p1,p2:w.p2};}
/* riferimento della parete: e = verso da sinistra a destra, d = verso della parete vista da dentro, u0/u1 = estremi, t0 = distanza della parete lungo d */
function wallFrame(w){const g=wallGeom(w),dx=g.p2[0]-g.p1[0],dy=g.p2[1]-g.p1[1],L=Math.hypot(dx,dy)||1,e=[dx/L,dy/L],d=[-e[1],e[0]];
 return {p1:g.p1,p2:g.p2,e,d,L,t0:g.p1[0]*d[0]+g.p1[1]*d[1],u0:g.p1[0]*e[0]+g.p1[1]*e[1],u1:g.p2[0]*e[0]+g.p2[1]*e[1]};}
function sideOfDir(e){if(Math.abs(e[1])<EPS)return e[0]>0?'ymax':'ymin';if(Math.abs(e[0])<EPS)return e[1]>0?'xmin':'xmax';return null;}
function wallSide(w){return w.auto?w.side:sideOfDir(wallFrame(w).e);}
function dirDesc(e){const sd=sideOfDir(e);if(sd)return cap(SIDEN[sd]);
 let a=Math.atan2(e[1],e[0])*180/Math.PI;a=((a%180)+180)%180;if(a>90)a=180-a;
 const d0=-e[1],d1=e[0],v=d1>0.2?'in alto':d1<-0.2?'in basso':'',h=d0>0.2?'a destra':d0<-0.2?'a sinistra':'';
 return 'Parete obliqua '+[v,h].filter(Boolean).join(' ')+' ('+Math.round(a)+'°)';}
function wallDesc(w){return dirDesc(wallFrame(w).e);}
function wallByKey(k){return S.walls.find(w=>w.k===k);}
function freeKey(side,list,an){if(side&&!list.some(w=>w.k===side))return side;let i=1;while(list.some(w=>w.k==='w'+i)||(an&&an['w'+i]))i++;return 'w'+i;}
function freeName(list){let i=1;while(list.some(w=>w.n==='Parete '+i))i++;return 'Parete '+i;}
/* vecchi formati: (lato, pos, a, b) della versione a pareti parallele agli assi -> p1, p2 */
function ptsFromSide(side,pos,a,b){return side==='ymax'?{p1:[a,pos],p2:[b,pos]}:side==='xmax'?{p1:[pos,b],p2:[pos,a]}:side==='ymin'?{p1:[b,pos],p2:[a,pos]}:{p1:[pos,a],p2:[pos,b]};}
function migrateWall(w){if(w.auto||w.p1||w.pos===undefined)return w;const g=ptsFromSide(w.side,w.pos,w.a,w.b),o=Object.assign({},w,g);delete o.side;delete o.pos;delete o.a;delete o.b;return o;}
function migrateWalls(d){
 return SIDES.map(s=>{const w={k:s,n:(d.names&&d.names[s])||DEFN[s],side:s,auto:true,show:!(d.show&&d.show[s]===false)};
  const r=d.wr&&d.wr[s];
  if(r&&d.room){const R=d.room,sd=s==='ymax'||s==='xmin'?[r[0],r[1]]:[-r[1],-r[0]],pos=s==='ymax'?R.y1:s==='xmin'?R.x0:s==='ymin'?R.y0:R.x1;
   return migrateWall({k:s,n:w.n,show:w.show,auto:false,side:s,pos,a:sd[0],b:sd[1]});}
  return w;});}
/* angoli di un mobile (antiorari): rettangolo orientato se ruotato, altrimenti l'ingombro */
function cornersP(p){return p.q?[[p.q[0],p.q[1]],[p.q[2],p.q[3]],[p.q[4],p.q[5]],[p.q[6],p.q[7]]]:[[p.x0,p.y0],[p.x1,p.y0],[p.x1,p.y1],[p.x0,p.y1]];}
function shift(p,dx,dy){p.x0+=dx;p.x1+=dx;p.y0+=dy;p.y1+=dy;if(p.q)for(let i=0;i<8;i+=2){p.q[i]+=dx;p.q[i+1]+=dy;}}
const $=id=>document.getElementById(id),svg=$('svg');
function newState(){return {v:2,nome:'Nuovo progetto',room:{x0:0,y0:0,x1:4000,y1:3000,h:2700},walls:defWalls(),pieces:[],
 ann:{ymax:[],xmax:[],ymin:[],xmin:[],C:[],D:[]},flip:false,mir:{},ref:{h:'L',v:'p'},nid:1,pid:1};}

function importDxf(f){
 if(!/\.dxf$/i.test(f.name)){alert(/\.dwg$/i.test(f.name)?'Questo è un DWG. In Metron salva o esporta lo stesso progetto in formato DXF e scegli quello.':'Il file non è un DXF.');return;}
 const mb=Math.round(f.size/1048576);
 modal(`<h2>Lettura del DXF</h2><p>${esc(f.name)} (${mb} MB). Con i file grandi può servire un minuto: la pagina resta utilizzabile.</p><div class="bar"><i id="bi"></i></div><p id="bt">Avvio…</p><div class="acts"><button id="bx">Annulla</button></div>`);
 try{const url=URL.createObjectURL(new Blob(['('+workerMain.toString()+')()'],{type:'text/javascript'}));worker=new Worker(url);}catch(x){closeModal();alert('Il browser non permette la lettura del DXF in questa modalità. Prova con Chrome o Edge.');return;}
 const w=worker;$('bx').onclick=()=>{w.terminate();worker=null;closeModal();};
 w.onmessage=ev=>{const m=ev.data;
  if(m.type==='p'){const b=$('bi'),t=$('bt');if(b){b.style.width=Math.round(m.pct*100)+'%';t.textContent=Math.round(m.pct*100)+'% — '+m.n+' elementi trovati';}}
  else if(m.type==='err'){w.terminate();worker=null;closeModal();alert('Errore nella lettura del DXF: '+m.msg);}
  else if(m.type==='done'){w.terminate();worker=null;importDone(f,m);}};
 w.onerror=ev=>{w.terminate();worker=null;closeModal();alert('Errore nella lettura del DXF.');};
 w.postMessage(f);}
/* pareti candidate: ogni mobile ha 4 lati (nel suo rettangolo, ruotato o no). Raggruppo i lati che guardano nella stessa direzione
   (entro ANGT gradi) e poi quelli alla stessa distanza (entro CLUS mm): ogni gruppo abbastanza lungo è una parete, a qualsiasi angolo.
   «multi» = c'è un pensile sopra una base con profondità diversa (segno di una vera parete, non di un fronte). */
const ANGT=1.5;
function cornersA(p){const q=p[7];return q?[[q[0],q[1]],[q[2],q[3]],[q[4],q[5]],[q[6],q[7]]]:[[p[0],p[1]],[p[3],p[1]],[p[3],p[4]],[p[0],p[4]]];}
function candidati(pcs){
 const E=[];
 for(const p of pcs){const c=cornersA(p);
  for(let i=0;i<4;i++){const a=c[i],b=c[(i+1)%4],ex=b[0]-a[0],ey=b[1]-a[1],L=Math.hypot(ex,ey);if(L<1)continue;
   const c2=c[(i+2)%4];
   E.push({a,b,ang:(Math.atan2(-ex,ey)*180/Math.PI+360)%360,z0:p[2],dep:Math.hypot(c2[0]-b[0],c2[1]-b[1])});}}
 E.sort((p,q)=>p.ang-q.ang);
 const G=[];for(const e of E){const g=G[G.length-1];if(g&&e.ang-g.a0<=ANGT)g.items.push(e);else G.push({a0:e.ang,items:[e]});}
 if(G.length>1){const L=G[G.length-1];if(G[0].a0+360-L.items[L.items.length-1].ang<=ANGT){G.pop();for(const e of L.items)G[0].items.push(e);}}
 const all=[];
 for(const g of G){
  let sx=0,sy=0;for(const e of g.items){const r=e.ang*Math.PI/180;sx+=Math.cos(r);sy+=Math.sin(r);}
  let am=Math.atan2(sy,sx)*180/Math.PI,dm;const k=Math.round(am/90),dv=am-k*90;
  if(Math.abs(dv)<0.3)dm=[Math.round(Math.cos(k*Math.PI/2)),Math.round(Math.sin(k*Math.PI/2))];else{const n=Math.hypot(sx,sy)||1;dm=[sx/n,sy/n];}
  const em=[dm[1]+0,-dm[0]+0];
  const it=g.items.map(e=>{const u1=e.a[0]*em[0]+e.a[1]*em[1],u2=e.b[0]*em[0]+e.b[1]*em[1];return {t:(e.a[0]+e.b[0])/2*dm[0]+(e.a[1]+e.b[1])/2*dm[1],u0:Math.min(u1,u2),u1:Math.max(u1,u2),z0:e.z0,dep:e.dep};}).sort((p,q)=>q.t-p.t);
  for(let i=0;i<it.length;){
   const t0=it[i].t,cl=[];let j=i;while(j<it.length&&t0-it[j].t<=CLUS){cl.push(it[j]);j++;}i=j;
   const iv=cl.slice().sort((a,b)=>a.u0-b.u0||a.u1-b.u1);let cop=0,fine=null,umin=null,umax=null;
   for(const e of iv){umin=umin===null?e.u0:Math.min(umin,e.u0);umax=umax===null?e.u1:Math.max(umax,e.u1);
    if(fine===null||e.u0>fine){cop+=e.u1-e.u0;fine=e.u1;}else if(e.u1>fine){cop+=e.u1-fine;fine=e.u1;}}
   if(cop<=0)continue;
   const bassi=cl.filter(e=>e.z0<300),alti=cl.filter(e=>e.z0>=1000);let multi=false;
   for(const p of bassi){for(const q of alti){if(Math.min(p.u1,q.u1)-Math.max(p.u0,q.u0)>100&&Math.abs(p.dep-q.dep)>=50){multi=true;break;}}if(multi)break;}
   all.push({d:dm,e:em,t:t0,umin,umax,cop,multi});}}
 let list=all.filter(c=>c.cop>=MIN_PARETE);
 if(!list.length&&all.length)list=[all.slice().sort((a,b)=>b.cop-a.cop)[0]];
 list=list.sort((a,b)=>b.cop-a.cop).slice(0,MAXCAND);
 for(const c of list){let m=-1e300;for(const p of pcs)for(const q of cornersA(p)){const v=q[0]*c.d[0]+q[1]*c.d[1];if(v>m)m=v;}c.off=Math.max(0,m-c.t);}
 return list;}
const chiave=c=>{const a=Math.atan2(c.d[1],c.d[0])*180/Math.PI,k=Math.round((((90-a)%360)+360)%360*10)/10;return k>=359.95?0:k;};
const ecand=(c,rev)=>rev?Object.assign({},c,{d:[-c.d[0]+0,-c.d[1]+0],e:[-c.e[0]+0,-c.e[1]+0]}):c;
const cpt=(c,u)=>[Math.round((u*c.e[0]+c.t*c.d[0])*10)/10+0,Math.round((u*c.e[1]+c.t*c.d[1])*10)/10+0];
const cEnds=(c,rev)=>{const A=cpt(c,Math.floor(c.umin)),B=cpt(c,Math.ceil(c.umax));return rev?[B,A]:[A,B];};
let pk=null;
function importDone(f,m){
 const pcs=m.pieces;
 if(!pcs.length){modal(`<h2>Nessun elemento trovato</h2><p>Nel DXF non ci sono solidi o mesh leggibili. Controlla che sia l'esportazione 3D del progetto Metron.</p><div class="acts"><button id="ok" class="pri">Chiudi</button></div>`);$('ok').onclick=closeModal;return;}
 closeModal();
 const ext={xmin:Math.min(...pcs.map(p=>p[0])),xmax:Math.max(...pcs.map(p=>p[3])),ymin:Math.min(...pcs.map(p=>p[1])),ymax:Math.max(...pcs.map(p=>p[4]))};
 const zmax=pcs.reduce((a,p)=>Math.max(a,p[5]),0),H=Math.max(2700,Math.ceil(zmax/100)*100);
 const cand=candidati(pcs);
  const prop=[];

 pk={f,pcs,ext,H,cand,on:new Set(prop),rev:new Set(),prop:new Set(prop),all:false,u:Math.max(w,h)/40,vb:[ext.xmin-mg,-ext.ymax-mg,w+2*mg,h+2*mg],moved:false,add:0,p1:null,mouse:null,hit:false,pts:null,dots:''};
